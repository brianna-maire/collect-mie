# Run: collect-mie examples/compare_fcs_run.example.yaml
# Requires examples/compare_manifest.txt (copy from compare_manifest.example.txt).

run:
  command: compare-fcs
  args:
    output: examples/output/compare_fcs.png
    write_run_record: examples/output/compare_fcs_run_record.yaml

mie:
  wavelength_nm: 488
  n_medium: 1.3374
  n_real: 1.602
  n_imag: 0.0
  polarization: unpolarized
  signal_mode: absolute-cross-section

fsc:
  center_deg: 0.0
  na_outer: 0.34
  na_inner: 0.23

ssc:
  center_deg: 90.0
  na: 1.29

compare_fcs:
  manifest: examples/compare_manifest.txt
  fsc_channel: FSC-A
  ssc_channel: SSC-A
  channel_naming: "$PnS"
  normalize: max
