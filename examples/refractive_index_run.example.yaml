# Run: collect-mie examples/refractive_index_run.example.yaml

run:
  command: plot-refractive-index
  args:
    output: examples/output/plot_refractive_index.png
    write_run_record: examples/output/refractive_index_run_record.yaml

mie:
  wavelength_nm: 488
  n_medium: 1.3374
  n_imag: 0.0
  polarization: unpolarized
  signal_mode: absolute-cross-section

ssc:
  center_deg: 90.0
  na: 1.29

plot_refractive_index:
  n_real_list: [1.000, 1.374, 1.602]
  d_min_um: 0.04
  d_max_um: 0.40
  n_diameters: 80
  normalize: none
