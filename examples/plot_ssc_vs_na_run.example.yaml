# Run: collect-mie examples/plot_ssc_vs_na_run.example.yaml

run:
  command: plot-ssc-vs-na
  args:
    output: examples/output/plot_ssc_vs_na.png
    write_run_record: examples/output/plot_ssc_vs_na_run_record.yaml

mie:
  wavelength_nm: 405
  n_medium: 1.3374 # must be >= na_max for a full 1.0–1.4 NA sweep
  n_real: 1.6020
  n_imag: 0.0
  polarization: unpolarized
  signal_mode: absolute-cross-section

ssc:
  center_deg: 90.0 # optional if already in plot_ssc_vs_na
  mask_half_angle_x_deg: 67.5
  mask_half_angle_z_deg: 90.0

plot_ssc_vs_na:
  na_min: 1.0
  na_max: 1.3
  n_na: 41
  diameter_um_list: [0.5, 1, 3, 6]
  normalize: none
