# Run: collect-mie examples/compare_ssc_run.example.yaml
# Requires examples/compare_manifest.txt (copy from compare_manifest.example.txt).

run:
  command: compare-ssc
  args:
    output: examples/output/compare_ssc.png
    # Optional; defaults to compare_ssc_histograms.png next to output.
    # histogram_output: examples/output/compare_ssc_histograms.png
    write_run_record: examples/output/compare_ssc_run_record.yaml

mie:
  wavelength_nm: 488
  n_medium: 1.3374
  n_real: 1.6020
  n_imag: 0.0
  polarization: unpolarized
  signal_mode: absolute-cross-section

ssc:
  center_deg: 90.0
  na: 1.15
  mask_half_angle_x_deg: 68.0
  mask_half_angle_z_deg: 75.0

compare_ssc:
  manifest: examples/compare_manifest.txt
  # Spectral (Cytek) files use e.g. "SSC (Violet)-A"; adjust to match your $PnS labels.
  ssc_channel: SSC (Blue)-H
  channel_naming: "$PnN"
  normalize: least_squares
  d_min_um: 0.06
  d_max_um: 0.5
  n_diameters: 120
  histogram_bins: 300
  channel_summary: peak_gated_median
  peak_selection: rightmost_prominent
  peak_histogram_bins: 300
  peak_prominence_fraction: 0.7
  median_gate_log_decades: 0.25
