[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "collect-mie"
version = "0.1.0"
description = "Mie scattering utilities for flow cytometry-style collection angles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "matplotlib>=3.7",
  "miepython>=2.0",
  "fcsparser>=0.2",
  "PyYAML>=6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
collect-mie = "collect_mie.__main__:main"
mie-plot-angle = "collect_mie.__main__:main"
mie-plot-diameter = "collect_mie.__main__:main"
mie-plot-refractive-index = "collect_mie.__main__:main"
mie-plot-ssc-vs-na = "collect_mie.__main__:main"
mie-plot-diameter-ssc-rect-mask = "collect_mie.__main__:main"
mie-compare-fcs = "collect_mie.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
